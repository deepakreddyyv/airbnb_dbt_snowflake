sources:
  - name: airbnb
    database: AIRBNB
    schema: RAW
    config:
      enabled: true
      meta:
        owner: "Deepak Reddy"
        description: "Source for Airbnb data in the RAW schema"
      freshness:
        filter: ""
        warn_after: {count: 2, period: day}
        error_after: {count: 10000, period: day}
      loaded_at_field: updated_at
      event_time: created_at
    tables:
      - name: src_hosts
        identifier: raw_hosts   
      - name: src_listings
        identifier: raw_listings
      - name: src_reviews
        identifier: raw_reviews
        config:
          freshness: null

